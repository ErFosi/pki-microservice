---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pki-ingress
  namespace: pki-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pki.example.com
      secretName: pki-tls
  rules:
    - host: pki.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pki-auth-gateway
                port:
                  number: 8000
